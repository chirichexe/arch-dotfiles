# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Vendor defaults for window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# NOTES: This is only for Hyprland > 0.48

# note for ja: This should NOT be implemented on Debian and Ubuntu

# windowrulev1 - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrulev1 = tag +browser, class:^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrulev1 = tag +browser, class:^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrulev1 = tag +browser, class:^(chrome-.+-Default)$ # Chrome PWAs
windowrulev1 = tag +browser, class:^([Cc]hromium)$
windowrulev1 = tag +browser, class:^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrulev1 = tag +browser, class:^(Brave-browser(-beta|-dev|-unstable)?)$
windowrulev1 = tag +browser, class:^([Tt]horium-browser|[Cc]achy-browser)$
windowrulev1 = tag +browser, class:^(zen-alpha|zen)$

# notif tags
windowrulev1 = tag +notif, class:^(swaync-control-center|swaync-notification-window|swaync-client|class)$

# KooL settings tag
windowrulev1 = tag +KooL_Cheat, title:^(KooL Quick Cheat Sheet)$
windowrulev1 = tag +KooL_Settings, title:^(KooL Hyprland Settings)$
windowrulev1 = tag +KooL-Settings, class:^(nwg-displays|nwg-look)$

# terminal tags
windowrulev1 = tag +terminal, class:^(Alacritty|kitty|kitty-dropterm)$

# email tags
windowrulev1 = tag +email, class:^([Tt]hunderbird|org.gnome.Evolution)$
windowrulev1 = tag +email, class:^(eu.betterbird.Betterbird)$

# project tags
windowrulev1 = tag +projects, class:^(codium|codium-url-handler|VSCodium)$
windowrulev1 = tag +projects, class:^(VSCode|code-url-handler)$
windowrulev1 = tag +projects, class:^(jetbrains-.+)$ # JetBrains IDEs

# screenshare tags
windowrulev1 = tag +screenshare, class:^(com.obsproject.Studio)$

# IM tags
windowrulev1 = tag +im, class:^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
windowrulev1 = tag +im, class:^([Ff]erdium)$
windowrulev1 = tag +im, class:^([Ww]hatsapp-for-linux)$
windowrulev1 = tag +im, class:^(ZapZap|com.rtosta.zapzap)$
windowrulev1 = tag +im, class:^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
windowrulev1 = tag +im, class:^(teams-for-linux)$
windowrulev1 = tag +im, class:^(im.riot.Riot|Element)$ # Element Matrix client

# game tags
windowrulev1 = tag +games, class:^(gamescope)$
windowrulev1 = tag +games, class:^(steam_app_\d+)$

# gamestore tags
windowrulev1 = tag +gamestore, class:^([Ss]team)$
windowrulev1 = tag +gamestore, title:^([Ll]utris)$
windowrulev1 = tag +gamestore, class:^(com.heroicgameslauncher.hgl)$

# file-manager tags
windowrulev1 = tag +file-manager, class:^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
windowrulev1 = tag +file-manager, class:^(app.drey.Warp)$

# wallpaper tags
windowrulev1 = tag +wallpaper, class:^([Ww]aytrogen)$

# multimedia tags
windowrulev1 = tag +multimedia, class:^([Aa]udacious)$

# multimedia-video tags
windowrulev1 = tag +multimedia_video, class:^([Mm]pv|vlc)$

# settings tags
windowrulev1 = tag +settings, title:^(ROG Control)$
windowrulev1 = tag +settings, class:^(wihotspot(-gui)?)$ # wifi hotspot
windowrulev1 = tag +settings, class:^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
windowrulev1 = tag +settings, class:^(gnome-disks|wihotspot(-gui)?)$
windowrulev1 = tag +settings, title:(Kvantum Manager)
windowrulev1 = tag +settings, class:^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrulev1 = tag +settings, class:^(nm-applet|nm-connection-editor|blueman-manager)$
windowrulev1 = tag +settings, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrulev1 = tag +settings, class:^(qt5ct|qt6ct|[Yy]ad)$
windowrulev1 = tag +settings, class:(xdg-desktop-portal-gtk)
windowrulev1 = tag +settings, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev1 = tag +settings, class:^([Rr]ofi)$

# viewer tags
windowrulev1 = tag +viewer, class:^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$ # system monitor
windowrulev1 = tag +viewer, class:^(evince)$ # document viewer 
windowrulev1 = tag +viewer, class:^(eog|org.gnome.Loupe)$ # image viewer

# Some special override rules
windowrulev1 = noblur, tag:multimedia_video
windowrulev1 = opacity 1.0, tag:multimedia_video
 
# POSITION
# windowrulev1 = center,floating:1 # warning, it cause even the menu to float and center.
windowrulev1 = center, tag:KooL_Cheat
windowrulev1 = center, class:([Tt]hunar), title:negative:(.*[Tt]hunar.*)
windowrulev1 = center, title:^(ROG Control)$
windowrulev1 = center, tag:KooL-Settings
windowrulev1 = center, title:^(Keybindings)$
windowrulev1 = center, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrulev1 = center, class:^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrulev1 = center, class:^([Ff]erdium)$
windowrulev1 = move 72% 7%,title:^(Picture-in-Picture)$ 
#windowrulev1 = move 72% 7%,title:^(Firefox)$ 

# windowrulev1 to avoid idle for fullscreen apps
#windowrulev1 = idleinhibit fullscreen, class:^(*)$
#windowrulev1 = idleinhibit fullscreen, title:^(*)$
windowrulev1 = idleinhibit fullscreen, fullscreen:1

# windowrulev1 move to workspace
#windowrulev1 = workspace 1, tag:email*
#windowrulev1 = workspace 2, tag:browser*
#windowrulev1 = workspace 3, class:^([Tt]hunar)$
#windowrulev1 = workspace 3, tag:projects*
#windowrulev1 = workspace 5, tag:gamestore*
#windowrulev1 = workspace 7, tag:im*
#windowrulev1 = workspace 8, tag:games*

# windowrulev1 move to workspace (silent)
#windowrulev1 = workspace 4 silent, tag:screenshare*
#windowrulev1 = workspace 6 silent, class:^(virt-manager)$
#windowrulev1 = workspace 6 silent, class:^(.virt-manager-wrapped)$
#windowrulev1 = workspace 9 silent, tag:multimedia*
#
# FLOA
windowrulev1 = float, tag:KooL_Cheat
windowrulev1 = float, tag:wallpaper
windowrulev1 = float, tag:settings
windowrulev1 = float, tag:viewer
windowrulev1 = float, tag:KooL-Settings
windowrulev1 = float, class:([Zz]oom|onedriver|onedriver-launcher)$
windowrulev1 = float, class:(org.gnome.Calculator), title:(Calculator)
windowrulev1 = float, class:^(mpv|com.github.rafostar.Clapper)$
windowrulev1 = float, class:^([Qq]alculate-gtk)$
#windowrulev1 = float, class:^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrulev1 = float, class:^([Ff]erdium)$
windowrulev1 = float, title:^(Picture-in-Picture)$
#windowrulev1 = float, title:^(Firefox)$

# windowrulev1 - ######### float popups and dialogue #######
windowrulev1 = float, title:^(Authentication Required)$
windowrulev1 = center, title:^(Authentication Required)$
windowrulev1 = float, class:(codium|codium-url-handler|VSCodium), title:negative:(.*codium.*|.*VSCodium.*)
windowrulev1 = float, class:^(com.heroicgameslauncher.hgl)$, title:negative:(Heroic Games Launcher)
windowrulev1 = float, class:^([Ss]team)$, title:negative:^([Ss]team)$
windowrulev1 = float, class:([Tt]hunar), title:negative:(.*[Tt]hunar.*)

windowrulev1 = float, title:^(Add Folder to Workspace)$
windowrulev1 = size 70% 60%, title:^(Add Folder to Workspace)$
windowrulev1 = center, title:^(Add Folder to Workspace)$

windowrulev1 = float, title:^(Save As)$
windowrulev1 = size 70% 60%, title:^(Save As)$
windowrulev1 = center, title:^(Save As)$

windowrulev1 = float, initialTitle:(Open Files)
windowrulev1 = size 70% 60%, initialTitle:(Open Files)

windowrulev1 = float, title:^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
windowrulev1 = center, title:^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
windowrulev1 = size 16% 12%, title:^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
# END of float popups and dialogue #######

# OPACITY
windowrulev1 = opacity 0.99 0.8, tag:browser
windowrulev1 = opacity 0.9 0.8, tag:projects
windowrulev1 = opacity 0.94 0.86, tag:im
windowrulev1 = opacity 0.94 0.86, tag:multimedia
windowrulev1 = opacity 0.8 0.8, tag:file-manager
windowrulev1 = opacity 0.8 0.7, tag:terminal
windowrulev1 = opacity 0.8 0.7, tag:settings
windowrulev1 = opacity 0.82 0.75, tag:viewer
windowrulev1 = opacity 0.9 0.7, tag:wallpaper
windowrulev1 = opacity 0.8 0.7, class:^(gedit|org.gnome.TextEditor|mousepad)$
windowrulev1 = opacity 0.9 0.8, class:^(deluge)$
windowrulev1 = opacity 0.9 0.8, class:^(seahorse)$ # gnome-keyring gui
windowrulev1 = opacity 0.95 0.75, title:^(Picture-in-Picture)$
windowrulev1 = opacity 0.9,class:^(code)$

# SIZE
windowrulev1 = size 65% 90%, tag:KooL_Cheat
windowrulev1 = size 70% 70%, tag:wallpaper
windowrulev1 = size 70% 70%, tag:settings
windowrulev1 = size 60% 70%, class:^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrulev1 = size 60% 70%, class:^([Ff]erdium)$

#windowrulev1 = size 25% 25%, title:^(Picture-in-Picture)$   
#windowrulev1 = size 25% 25%, title:^(Firefox)$ 

# PINNING
windowrulev1 = pin, title:^(Picture-in-Picture)$
#windowrulev1 = pin,title:^(Firefox)$ 

# windowrulev1 - extras
windowrulev1 = keepaspectratio, title:^(Picture-in-Picture)$

# BLUR & FULLSCREEN
windowrulev1 = noblur, tag:games
windowrulev1 = fullscreen, tag:games


#This not gonna take the focus to the window that appears when hovering over some of the parts of the IntelliJ Products 
windowrulev1 = noinitialfocus, class:^(jetbrains-*)
windowrulev1 = noinitialfocus, title:^(wind.*)$

#This will gonna make the VS Code bluer like other apps 
windowrulev1 = opacity 0.8,class:^(code)$

#windowrulev1 = bordercolor rgb(EE4B55) rgb(880808), fullscreen:1
#windowrulev1 = bordercolor rgb(282737) rgb(1E1D2D), floating:1
#windowrulev1 = opacity 0.8 0.8, pinned:1

